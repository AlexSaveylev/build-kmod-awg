name: Build kmod-amneziawg for ImmortalWrt 24.10.6 (kernel 6.6.133)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt 24.10.6 SDK (ramips/mt7621)
        run: |
          SDK_URL=$(printf '%s://%s/%s' https downloads.immortalwrt.org releases/24.10.6/targets/ramips/mt7621/)
          SDK_FILE=$(wget -qO- "$SDK_URL" | grep -oE 'immortalwrt-sdk-24\.10\.6-ramips-mt7621_[^"]+\.tar\.(xz|zst)' | head -n1)
          echo "Downloading $SDK_FILE"
          wget -q "${SDK_URL}${SDK_FILE}" -O sdk.tar
          mkdir sdk && tar -xf sdk.tar -C sdk --strip-components=1

      - name: Add amneziawg package source and compile
        run: |
          cd sdk
          ./scripts/feeds update base packages
          git clone --depth 1 $(printf '%s://%s/%s' https github.com 2Grey/awg-openwrt.git) package/awg-openwrt
          make defconfig
          make package/kmod-amneziawg/compile V=s

      - name: Upload compiled ipk
        uses: actions/upload-artifact@v4
        with:
          name: kmod-amneziawg-6.6.133
          path: sdk/bin/targets/ramips/mt7621/packages/kmod-amneziawg*.ipk
